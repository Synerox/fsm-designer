# Push a tag like v0.1.0 to build the Windows installers and attach them
# to a GitHub release for that tag. A manual run from a branch builds them
# as a downloadable artifact of the run instead.
name: Release desktop app

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      # The installers are named after the version in tauri.conf.json, not the
      # tag, so a tag pushed without bumping the versions would publish v0.1.0
      # installers under a newer release.
      - name: Check the tag matches the app version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          node -e '
            const fs = require("node:fs");
            const tag = process.env.GITHUB_REF_NAME, want = tag.replace(/^v/, "");
            const json = (f) => JSON.parse(fs.readFileSync(f, "utf8")).version;
            const found = {
              "apps/desktop/src-tauri/tauri.conf.json": json("apps/desktop/src-tauri/tauri.conf.json"),
              "apps/desktop/src-tauri/Cargo.toml": fs.readFileSync("apps/desktop/src-tauri/Cargo.toml", "utf8").match(/^version\s*=\s*"([^"]*)"/m)?.[1],
              "apps/desktop/package.json": json("apps/desktop/package.json"),
              "apps/editor/package.json": json("apps/editor/package.json"),
              "packages/core/package.json": json("packages/core/package.json"),
            };
            const bad = Object.entries(found).filter(([, v]) => v !== want);
            for (const [f, v] of bad) console.log(`::error file=${f}::version ${v} does not match tag ${tag}`);
            process.exit(bad.length ? 1 : 0);
          '
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - run: pnpm install --frozen-lockfile
      - run: pnpm bundle
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/release/bundle/msi/*.msi
      - uses: actions/upload-artifact@v4
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        with:
          name: installers
          if-no-files-found: error
          path: |
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/release/bundle/msi/*.msi
