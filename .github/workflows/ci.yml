# Build and run every test on pull requests. Icarus Verilog is installed so
# the cycle-by-cycle checks of the Verilog importer run instead of skipping.
name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: sudo apt-get update && sudo apt-get install -y iverilog
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
