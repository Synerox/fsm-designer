# Test everything, then build the web editor and publish it to GitHub Pages.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      # For the Verilog importer's cycle-by-cycle checks, which skip without it.
      - run: sudo apt-get update && sudo apt-get install -y iverilog
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      # Relative asset paths, so the page works under /<repo>/.
      - run: pnpm --filter @fsm/editor exec vite build --base ./
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/editor/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
