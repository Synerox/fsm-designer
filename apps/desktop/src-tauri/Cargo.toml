[package]
name = "fsm-designer"
version = "0.1.0"
description = "Draw finite state machine diagrams, import them from Verilog, and export PNG, SVG and LaTeX"
license = "MIT"
edition = "2021"

[lib]
name = "fsm_designer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
