<!-- Layout taste test: pairs of auto layouts of the same machine; the viewer picks the better one.
     Generated by make-pairs.ts, which fills in the pair data below. See docs/auto-layout.md. -->
<meta charset="utf-8">
<title>Layout Taste Test</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a narrow header with progress, then one row per pair: two drawing sheets side by side (stacked on phones) with the pick bar under them. */
:root {
  --bg: #f3f4f1; --surface: #ffffff; --fg: #1d2420; --muted: #5d6762; --line: #d5dad6;
  --paper: #ffffff; --accent: #1f6f5c; --accent-ink: #ffffff; --chosen: #e3f1ec;
  --sans: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #151a18; --surface: #1d2421; --fg: #e6ebe8; --muted: #9aa5a0; --line: #33403b;
  --paper: #eef1ef; --accent: #5fc0a3; --accent-ink: #0f1513; --chosen: #20372f; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #151a18; --surface: #1d2421; --fg: #e6ebe8; --muted: #9aa5a0; --line: #33403b;
  --paper: #eef1ef; --accent: #5fc0a3; --accent-ink: #0f1513; --chosen: #20372f; color-scheme: dark }
body { background: var(--bg); color: var(--fg); font-family: var(--sans); line-height: 1.55; }
.wrap { max-width: 1180px; margin: 0 auto; padding-block: 28px 64px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: 28px; }
header { display: grid; gap: 8px; }
h1 { font-size: 1.6rem; margin: 0; text-wrap: balance; letter-spacing: .01em; }
.lede { margin: 0; color: var(--muted); max-width: 62ch; }
.status { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; font-family: var(--mono); font-size: .85rem; color: var(--muted); }
.bar { flex: 1 1 200px; height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; min-width: 120px; }
.bar i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .3s; }
.note-off { font-size: .85rem; color: var(--muted); }
.pair { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 16px; display: grid; gap: 12px; }
.pair-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.pair-head h2 { font-size: 1rem; margin: 0; font-family: var(--mono); font-weight: 500; }
.pair-head span { font-size: .8rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.sheets { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
@media (max-width: 720px) { .sheets { grid-template-columns: 1fr; } }
.sheet { min-width: 0; display: grid; gap: 6px; }
.sheet .tag { font-family: var(--mono); font-size: .8rem; color: var(--muted); letter-spacing: .08em; }
.paper { background: var(--paper); border: 2px solid var(--line); border-radius: 8px; padding: 10px; display: flex; align-items: center; justify-content: center; aspect-ratio: 4 / 3; max-width: 100%; overflow: hidden; }
.paper svg { width: 100%; height: 100%; }
.sheet.picked .paper { border-color: var(--accent); }
.choices { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
button { font: inherit; font-size: .9rem; padding: 7px 14px; border-radius: 6px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); cursor: pointer; }
button:hover { border-color: var(--accent); }
button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
textarea { font-family: var(--mono); font-size: .8rem; width: 100%; max-width: 100%; box-sizing: border-box; padding: 8px; border-radius: 6px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); }
input[type=text] { font: inherit; font-size: .9rem; flex: 1 1 220px; min-width: 0; padding: 7px 10px; border-radius: 6px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); }
.saved { font-size: .8rem; color: var(--muted); min-width: 5em; }
@media (prefers-reduced-motion: reduce) { .bar i { transition: none; } }
</style>

<div class="wrap">
  <header>
    <h1>自動排版：選你喜歡的</h1>
    <p class="lede">每一組是同一台狀態機的兩種排法（文字已隱藏，只看形狀）。點你覺得比較好的那一張，或按「差不多」。想補充原因可以寫在旁邊的欄位。選完告訴我，我會照你的選擇調整評分。</p>
    <div class="status"><span id="count">0 / 0 已選</span><div class="bar"><i id="fill"></i></div></div>
    <p class="note-off" id="offline" hidden>這個檢視無法自動儲存選擇。選完後按下面的「複製選擇」，把內容存成 picks.json。</p>
    <div class="choices"><button type="button" id="copy">複製選擇（JSON）</button><span class="saved" id="copied"></span></div>
    <textarea id="dump" readonly hidden rows="4" aria-label="選擇（JSON）"></textarea>
  </header>
  <main id="list" style="display:grid;gap:20px"></main>
</div>

<script>
const PAIRS = __PAIRS__;
const picks = {};
let db = null;
const list = document.getElementById("list");
function render() {
  list.textContent = "";
  for (const p of PAIRS) {
    const sec = document.createElement("section");
    sec.className = "pair";
    sec.id = p.id;
    const pick = picks[p.id] || {};
    sec.innerHTML = `
      <div class="pair-head"><h2>${p.machine}</h2><span>第 ${PAIRS.indexOf(p) + 1} 組・${p.states} 個狀態</span></div>
      <div class="sheets">
        <div class="sheet ${pick.choice === "a" ? "picked" : ""}"><span class="tag">A</span><div class="paper" role="button" tabindex="0" data-c="a" aria-label="選 A">${p.a}</div></div>
        <div class="sheet ${pick.choice === "b" ? "picked" : ""}"><span class="tag">B</span><div class="paper" role="button" tabindex="0" data-c="b" aria-label="選 B">${p.b}</div></div>
      </div>
      <div class="choices">
        <button data-c="a" aria-pressed="${pick.choice === "a"}">A 比較好</button>
        <button data-c="b" aria-pressed="${pick.choice === "b"}">B 比較好</button>
        <button data-c="same" aria-pressed="${pick.choice === "same"}">差不多</button>
        <input type="text" id="note-${p.id}" placeholder="原因（可不填）" value="">
        <span class="saved" id="saved-${p.id}"></span>
      </div>`;
    sec.querySelector(`#note-${p.id}`).value = pick.note || "";
    for (const el of sec.querySelectorAll("[data-c]")) {
      const go = () => choose(p.id, el.dataset.c);
      el.addEventListener("click", go);
      if (el.classList.contains("paper")) el.addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); go(); } });
    }
    sec.querySelector(`#note-${p.id}`).addEventListener("change", (e) => save(p.id, { ...(picks[p.id] || {}), note: e.target.value }));
    list.appendChild(sec);
  }
  progress();
}
function progress() {
  const done = PAIRS.filter((p) => picks[p.id] && picks[p.id].choice).length;
  document.getElementById("count").textContent = `${done} / ${PAIRS.length} 已選`;
  document.getElementById("fill").style.width = `${(100 * done) / PAIRS.length}%`;
}
function choose(id, c) {
  const note = document.getElementById(`note-${id}`).value;
  save(id, { choice: c, note });
  const sec = document.getElementById(id);
  sec.querySelectorAll(".sheet").forEach((s, i) => s.classList.toggle("picked", (i === 0 && c === "a") || (i === 1 && c === "b")));
  sec.querySelectorAll("button[data-c]").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.c === c)));
  progress();
}
async function save(id, value) {
  picks[id] = value;
  const tag = document.getElementById(`saved-${id}`);
  if (!db) { tag.textContent = "未儲存"; return; }
  tag.textContent = "儲存中…";
  try { await db.doc(`picks/${id}`).set({ choice: value.choice || "", note: value.note || "", at: new Date().toISOString() }); tag.textContent = "已儲存"; }
  catch (e) { tag.textContent = "儲存失敗"; }
}
document.getElementById("copy").addEventListener("click", async () => {
  const json = JSON.stringify(Object.fromEntries(Object.entries(picks).filter(([, v]) => v.choice).map(([k, v]) => [k, v.choice])));
  const dump = document.getElementById("dump");
  dump.value = json;
  try { await navigator.clipboard.writeText(json); document.getElementById("copied").textContent = "已複製"; }
  catch { dump.hidden = false; dump.select(); document.getElementById("copied").textContent = "請手動複製下方文字"; }
});
render();
(async () => {
  db = window.claude ? await window.claude.use("db") : null;
  if (!db) { document.getElementById("offline").hidden = false; return; }
  try {
    const snap = await db.collection("picks").get();
    for (const doc of snap.docs) { const v = doc.data(); if (v) picks[doc.id] = { choice: v.choice, note: v.note }; }
    render();
    for (const id of Object.keys(picks)) { const t = document.getElementById(`saved-${id}`); if (t) t.textContent = "已儲存"; }
  } catch (e) { document.getElementById("offline").hidden = false; }
})();
</script>
